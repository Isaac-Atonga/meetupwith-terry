<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* Pink background */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    z-index: -3;
}

/* Her image fading */
body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url("her-image.jpeg") center / cover no-repeat;
    animation: fadeImage 8s infinite;
    z-index: -2;
}

@keyframes fadeImage {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.35; }
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -20px;
    color: rgba(255, 0, 80, 0.7);
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px 25px;
    border-radius: 22px;
    text-align: center;
    max-width: 350px;
    width: 90%;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    z-index: 10;
}

/* Flower */
.flower {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 10px;
    transform: scale(0);
    transition: transform 1.5s ease;
}

.flower.bloom {
    transform: scale(1);
}

.petal {
    position: absolute;
    width: 50px;
    height: 50px;
    background: #ff6f91;
    border-radius: 50%;
}

.petal:nth-child(1) { top: 0; left: 35px; }
.petal:nth-child(2) { left: 0; top: 35px; }
.petal:nth-child(3) { right: 0; top: 35px; }
.petal:nth-child(4) { bottom: 0; left: 35px; }

.center {
    position: absolute;
    width: 42px;
    height: 42px;
    background: gold;
    border-radius: 50%;
    top: 39px;
    left: 39px;
}

.stem {
    width: 6px;
    height: 70px;
    background: #2e7d32;
    margin: 0 auto 10px;
    border-radius: 10px;
}

/* Glowing name */
h1 {
    margin: 10px 0;
    font-size: 22px;
    color: #e91e63;
    text-shadow: 0 0 10px #ff80ab;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #ff80ab; }
    to { text-shadow: 0 0 15px #ff4081; }
}

p {
    font-size: 15px;
    color: #444;
    line-height: 1.6;
}

/* Hidden love note */
.love-note {
    display: none;
    margin-top: 10px;
    color: #d81b60;
    font-weight: bold;
}

/* Button */
.music-link {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    border-radius: 20px;
    background: #e91e63;
    color: white;
    font-size: 14px;
    text-decoration: none;
}

.music-link:hover {
    background: #d81b60;
}
</style>
</head>

<body>

<script>
/* Hearts */
for (let i = 0; i < 25; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "♥";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDelay = Math.random() * 6 + "s";
    heart.style.fontSize = (14 + Math.random() * 20) + "px";
    document.body.appendChild(heart);
}

/* Surprise action */
function revealSurprise() {
    document.querySelector(".flower").classList.add("bloom");
    document.querySelector(".love-note").style.display = "block";
}
</script>

<div class="card">

    <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
    </div>

    <div class="stem"></div>

    <h1>😂Meet up request from me to Terry Rapha ❤️</h1>

    <p>
        Haa, i know we haven't discussed much about our lives,<br>
        and i'm interested in getting to know you better<br>
        and also you getting to know me better.<br>
        This Friday of 30-1-2026.
    </p>

    <p class="love-note">
        💌 Looking forward to spending time with you 💌
    </p>

    <a class="music-link"
       href="https://www.youtube.com/watch?v=o4lZ-nqZzDo&list=RDo4lZ-nqZzDo&start_radio=1&pp=ygUeZm9yIGJvYmJ5IGZvciBiYWJ5IGpvaG4gZGVudmVyoAcB"
       target="_blank"
       onclick="revealSurprise()">
       Tap for Surprise 🎶
    </a>

</div>

</body>
</html>
